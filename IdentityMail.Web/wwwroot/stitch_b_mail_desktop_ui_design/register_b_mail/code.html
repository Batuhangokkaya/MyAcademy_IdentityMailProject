<!DOCTYPE html>

<html class="h-full bg-surface" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>B-Mail - Register</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#cbdbf5",
                        "secondary-fixed-dim": "#b7c4ff",
                        "on-tertiary": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-surface": "#0b1c30",
                        "error": "#ba1a1a",
                        "outline": "#737686",
                        "primary-fixed-dim": "#b4c5ff",
                        "primary-container": "#2563eb",
                        "surface-container-highest": "#d3e4fe",
                        "background": "#f8f9ff",
                        "on-tertiary-fixed-variant": "#444749",
                        "on-secondary-fixed-variant": "#0039b5",
                        "primary": "#004ac6",
                        "surface-tint": "#0053db",
                        "surface-variant": "#d3e4fe",
                        "primary-fixed": "#dbe1ff",
                        "outline-variant": "#c3c6d7",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#00174b",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#001551",
                        "on-primary-container": "#eeefff",
                        "on-surface-variant": "#434655",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-container": "#e5eeff",
                        "secondary": "#1d4ed8",
                        "surface-container-high": "#dce9ff",
                        "on-tertiary-fixed": "#191c1e",
                        "inverse-surface": "#213145",
                        "tertiary-container": "#6b6e70",
                        "secondary-container": "#4069f2",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-bright": "#f8f9ff",
                        "on-secondary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-error": "#ffffff",
                        "on-background": "#0b1c30",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary": "#525657",
                        "inverse-primary": "#b4c5ff",
                        "secondary-fixed": "#dce1ff",
                        "on-tertiary-container": "#eff1f3",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "navbar_height": "64px",
                        "gutter": "1.5rem",
                        "margin_page": "2rem",
                        "stack_md": "1rem",
                        "sidebar_width": "260px",
                        "stack_lg": "1.5rem",
                        "stack_sm": "0.5rem"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm-mobile": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1.0", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-sm-mobile": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.0", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    },
                    boxShadow: {
                        'level-2': '0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05)',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-surface text-on-surface font-sans antialiased">
<div class="sm:mx-auto sm:w-full sm:max-w-md">
<div class="flex justify-center items-center gap-2 mb-8">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="mail" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mail</span>
<span class="font-headline-md text-headline-md text-primary">B-Mail</span>
</div>
<h2 class="mt-6 text-center font-display-lg text-display-lg text-on-surface">
            Create your account
        </h2>
</div>
<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-[480px]">
<div class="bg-surface-container-lowest py-8 px-4 shadow-level-2 sm:rounded-xl sm:px-10 border border-outline-variant">
<form action="#" class="space-y-6" method="POST">
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="firstName">First Name</label>
<div class="mt-1">
<input class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline-variant focus:outline-none focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright text-on-surface transition-colors duration-200" id="firstName" name="firstName" required="" type="text"/>
</div>
<p class="mt-1 text-xs text-error h-4" id="firstName-error"></p>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="lastName">Last Name</label>
<div class="mt-1">
<input class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline-variant focus:outline-none focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright text-on-surface transition-colors duration-200" id="lastName" name="lastName" required="" type="text"/>
</div>
<p class="mt-1 text-xs text-error h-4" id="lastName-error"></p>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="username">Username</label>
<div class="mt-1">
<input class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline-variant focus:outline-none focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright text-on-surface transition-colors duration-200" id="username" name="username" required="" type="text"/>
</div>
<p class="mt-1 text-xs text-error h-4" id="username-error"></p>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="email">Email Address</label>
<div class="mt-1">
<input autocomplete="email" class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline-variant focus:outline-none focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright text-on-surface transition-colors duration-200" id="email" name="email" required="" type="email"/>
</div>
<p class="mt-1 text-xs text-error h-4" id="email-error"></p>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="password">Password</label>
<div class="mt-1 relative">
<input autocomplete="new-password" class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline-variant focus:outline-none focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright text-on-surface transition-colors duration-200 pr-10" id="password" name="password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-on-surface-variant focus:outline-none transition-colors" onclick="togglePassword('password', 'togglePasswordIcon1')" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="togglePasswordIcon1">visibility</span>
</button>
</div>
<p class="mt-1 text-xs text-error h-4" id="password-error"></p>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="confirmPassword">Confirm Password</label>
<div class="mt-1 relative">
<input autocomplete="new-password" class="appearance-none block w-full px-3 py-2 border border-outline-variant rounded-lg shadow-sm placeholder-outline-variant focus:outline-none focus:ring-primary focus:border-primary sm:text-sm bg-surface-bright text-on-surface transition-colors duration-200 pr-10" id="confirmPassword" name="confirmPassword" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-on-surface-variant focus:outline-none transition-colors" onclick="togglePassword('confirmPassword', 'togglePasswordIcon2')" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="togglePasswordIcon2">visibility</span>
</button>
</div>
<p class="mt-1 text-xs text-error h-4" id="confirmPassword-error"></p>
</div>
<div>
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200 ease-in-out" type="submit">
                        Register
                    </button>
</div>
</form>
<div class="mt-6 text-center">
<a class="font-body-md text-body-md text-primary hover:text-secondary transition-colors duration-200" href="#">
                    Already have an account? Sign In
                </a>
</div>
</div>
</div>
<script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
