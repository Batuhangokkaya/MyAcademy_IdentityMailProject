<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - B-Mail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#b4c5ff",
                        "secondary-container": "#4069f2",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "outline": "#737686",
                        "surface-container": "#e5eeff",
                        "surface-container-high": "#dce9ff",
                        "surface-container-low": "#eff4ff",
                        "on-primary-container": "#eeefff",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#434655",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#0b1c30",
                        "secondary-fixed-dim": "#b7c4ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "primary-fixed": "#dbe1ff",
                        "tertiary": "#525657",
                        "inverse-on-surface": "#eaf1ff",
                        "primary": "#004ac6",
                        "on-primary-fixed-variant": "#003ea8",
                        "tertiary-container": "#6b6e70",
                        "on-tertiary-container": "#eff1f3",
                        "on-secondary-fixed": "#001551",
                        "tertiary-fixed": "#e0e3e5",
                        "secondary-fixed": "#dce1ff",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "background": "#f8f9ff",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#00174b",
                        "on-background": "#0b1c30",
                        "surface-variant": "#d3e4fe",
                        "on-secondary-fixed-variant": "#0039b5",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#444749",
                        "surface-container-highest": "#d3e4fe",
                        "primary-container": "#2563eb",
                        "on-secondary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#191c1e",
                        "on-secondary": "#ffffff",
                        "secondary": "#1d4ed8",
                        "surface": "#f8f9ff",
                        "surface-bright": "#f8f9ff",
                        "inverse-surface": "#213145",
                        "outline-variant": "#c3c6d7",
                        "surface-tint": "#0053db"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack_lg": "1.5rem",
                        "sidebar_width": "260px",
                        "stack_sm": "0.5rem",
                        "navbar_height": "64px",
                        "stack_md": "1rem",
                        "gutter": "1.5rem",
                        "margin_page": "2rem"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1.0", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.0", "fontWeight": "500" }],

                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }]

                }
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Suppressed navigation shell due to transactional intent -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-[0_20px_25px_-5px_rgb(0_0_0_/_0.1)] p-8 sm:p-12 relative overflow-hidden">
<!-- Subtle decorative background element -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-surface-container-high rounded-full blur-3xl opacity-50 pointer-events-none"></div>
<!-- Header / Logo -->
<div class="flex flex-col items-center mb-8 relative z-10">
<div class="flex items-center justify-center w-12 h-12 bg-primary rounded-lg shadow-sm mb-4">
<span class="material-symbols-outlined text-on-primary font-bold" data-icon="mail">mail</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">B-Mail</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Welcome Back</p>
</div>
<!-- Form -->
<form class="space-y-6 relative z-10">
<div class="space-y-stack_sm">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined" data-icon="person" style="font-size: 20px;">person</span>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg font-body-md text-body-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline-variant" id="email" name="email" placeholder="employee@b-mail.com" required="" type="email"/>
</div>
</div>
<div class="space-y-stack_sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-outline">
<span class="material-symbols-outlined" data-icon="lock" style="font-size: 20px;">lock</span>
</span>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg font-body-md text-body-md bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded transition-colors" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                    Remember Me
                </label>
</div>
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                Log In
            </button>
</form>
<!-- Footer -->
<div class="mt-8 text-center relative z-10">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-1" href="#">Register here</a>
</p>
</div>
</div>
</body></html>
