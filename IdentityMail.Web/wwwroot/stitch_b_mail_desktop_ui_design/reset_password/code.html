<body class="bg-surface h-full flex items-center justify-center font-body-md text-on-surface antialiased">
<!-- Reset Password Card -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_6px_-1px_rgb(0_0_0_/_0.05),_0_2px_4px_-2px_rgb(0_0_0_/_0.05)] border border-outline-variant p-8 md:p-10 m-4">
<!-- Branding Header -->
<header class="flex flex-col items-center mb-8">
<div class="w-12 h-12 bg-primary-container rounded-full flex items-center justify-center mb-4 text-on-primary-container">
<span class="material-symbols-outlined" data-icon="mail" style="font-variation-settings: 'FILL' 1; font-size: 24px;">mail</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">B-Mail</h1>
</header>
<!-- Form Content -->
<section>
<div class="text-center mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Create a new password for your B-Mail account.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- New Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="new-password">New Password</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md placeholder-on-surface-variant/60 transition-all duration-200" id="new-password" name="new-password" placeholder="Enter your new password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm New Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="confirm-password">Confirm New Password</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md placeholder-on-surface-variant/60 transition-all duration-200" id="confirm-password" name="confirm-password" placeholder="Enter your new password again" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200" type="submit">
                    Reset Password
                </button>
</form>
<!-- Back to Login Link -->
<div class="mt-8 text-center">
<a class="font-label-md text-label-md text-primary hover:text-secondary hover:underline transition-colors duration-200 flex items-center justify-center gap-2" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_back">arrow_back</span>
                    Back to Login
                </a>
</div>
</section>
</main>
<script>
        // Simple toggle for password visibility
        document.querySelectorAll('button[type="button"]').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                    icon.setAttribute('data-icon', 'visibility');
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                    icon.setAttribute('data-icon', 'visibility_off');
                }
            });
        });
    </script>
